services:

  postgres:
      image: postgres:17
      container_name: parking_db
      env_file: 
        .env.local
      ports:
        - "6432:5432"  
      volumes:
        - parking_data:/var/lib/postgresql/data
      # networks:
      #   - parking_network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped


volumes:
  parking_data:
