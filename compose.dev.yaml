services:

  postgres:
      image: postgres:17
      container_name: parking_db
      env_file:
        .env.local
      command:
        - postgres
        - -c
        - wal_level=replica
        - -c
        - max_wal_senders=10
        - -c
        - max_replication_slots=10
        - -c
        - wal_keep_size=512MB
      ports:
        - "6432:5432"
      volumes:
        - parking_data:/var/lib/postgresql/data
        - ./docker/postgres-primary-init:/docker-entrypoint-initdb.d:ro
      networks:
        - parking_network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

  postgres_replica:
      image: postgres:17
      container_name: parking_db_replica
      # переопределяем entrypoint: вместо стандартной инициализации (initdb)
      # сначала выполняется pg_basebackup с primary, потом стартует postgres
      entrypoint: ["bash", "/init-replica.sh"]
      env_file:
        .env.local
      ports:
        - "7432:5432"
      volumes:
        - parking_data_replica:/var/lib/postgresql/data
        - ./docker/postgres-replica-init/init-replica.sh:/init-replica.sh:ro
      networks:
        - parking_network
      healthcheck:
        # -d postgres: без него pg_isready стучится в БД с именем пользователя
        # (postgres_r) и сыплет FATAL "database does not exist" в логи
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPLICA_USER:-postgres_r} -d postgres || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

volumes:
  parking_data:
  parking_data_replica:

networks:
  parking_network:
    driver: bridge
